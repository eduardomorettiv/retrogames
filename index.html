<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>🕹️ Retro games</title>
</head>

<body>
    <header>
        <h1>🕹️ Retro Games</h1>
    </header>
    <section>
        <h2>Sobre nossa Loja</h2>
        <p>Aqui você pode colocar seus jogos!</p>
    </section>
    <section>
        <h2>Cadastre seu jogo!</h2>
        <button id="cadastrar" type="button">Cadastrar</button>
    </section>
    <section>
        <h2>Jogos disponíveis</h2>
        <p id="mensagemVazia">Nenhum jogo cadastrado</p>
        <div id="listarjogos"></div>
    </section>

    <dialog id="modalCadastro">
        <div>
            <button id="cancelar" type="button" aria-label="Fechar">x</button>
        </div>
        <h2>Cadastrar Jogo</h2>
        <form id="formulario">
            <input id="nome" type="text" placeholder="Título" required>
            <input id="artista" type="text" placeholder="Plataforma" required>
            <input id="genero" type="text" placeholder="Desenvolvedora" required>
            <input id="imagem" type="url" placeholder="URL da imagem da capa (https://imagem.png)" required>
            <input id="preco" type="number" min="0" step="0.01" placeholder="Preço" required>
            <input id="data" type="date" placeholder="Data do registro" required>
            <button type="submit">Confirmar</button>
        </form>
    </dialog>
</body>

<script src="script.js"></script>

</html>
